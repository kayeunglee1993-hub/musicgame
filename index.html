/* ============================================
   Audio Engine
   ============================================ */
var audioCtx = null;

function ensureAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playTone(freq, duration) {
    duration = duration || 0.4;
    try {
        ensureAudio();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration + 0.05);
    } catch(e) { /* silent fail */ }
}

function playCorrectSound() {
    playTone(523.25, 0.12);
    setTimeout(function() { playTone(659.25, 0.12); }, 80);
    setTimeout(function() { playTone(783.99, 0.25); }, 160);
}

function playWrongSound() {
    try {
        ensureAudio();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.35);
    } catch(e) { /* silent fail */ }
}

/* ============================================
   Canvas Staff Renderer
   ============================================ */
var canvas = document.getElementById('staff-canvas');
var ctxCanvas = canvas.getContext('2d');
var CANVAS_LOGICAL_W = 380;
var CANVAS_LOGICAL_H = 150;

function initCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = CANVAS_LOGICAL_W * dpr;
    canvas.height = CANVAS_LOGICAL_H * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.aspectRatio = CANVAS_LOGICAL_W + '/' + CANVAS_LOGICAL_H;
    ctxCanvas.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function getColors() {
    var dark = document.documentElement.classList.contains('dark');
    return {
        staffLine: dark ? '#6b7280' : '#9ca3af',
        noteFill: dark ? '#f5f3ff' : '#1e1b4b',
        clefFill: dark ? '#9ca3af' : '#6b7280',
        bg: dark ? '#1a1030' : '#fffbf5',
        correctFill: '#22c55e',
        wrongFill: '#ef4444',
        labelBg: dark ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.9)'
    };
}

function drawStaff(noteKey, highlight, showLabel) {
    var c = getColors();
    var ctx = ctxCanvas;
    var w = CANVAS_LOGICAL_W;
    var h = CANVAS_LOGICAL_H;
    var ls = 14; // line spacing
    var staffTop = 38;
    var staffLeft = 70;
    var staffRight = w - 16;
    var noteX = w * 0.55;

    ctx.clearRect(0, 0, w, h);

    // Staff lines
    ctx.strokeStyle = c.staffLine;
    ctx.lineWidth = 1.4;
    for (var i = 0; i < 5; i++) {
        var ly = staffTop + i * ls;
        ctx.beginPath();
        ctx.moveTo(staffLeft, ly);
        ctx.lineTo(staffRight, ly);
        ctx.stroke();
    }

    // Treble clef
    ctx.save();
    var clefSize = Math.round(ls * 5.8);
    ctx.font = clefSize + 'px "Times New Roman", "Noto Sans Symbols 2", "Segoe UI Symbol", serif';
    ctx.fillStyle = c.clefFill;
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1D11E}', staffLeft + ls * 0.3, staffTop + ls * 1.85);
    ctx.restore();

    // Note
    if (!noteKey) return;
    var noteInfo = NOTES_MAP[noteKey];
    if (!noteInfo) return;
    var noteY = staffTop + noteInfo.pos * (ls / 2);
    var noteColor = c.noteFill;
    if (highlight === 'correct') noteColor = c.correctFill;
    if (highlight === 'wrong') noteColor = c.wrongFill;

    // Ledger lines
    ctx.strokeStyle = c.staffLine;
    ctx.lineWidth = 1.4;
    if (noteInfo.pos >= 10) {
        for (var p = 10; p <= noteInfo.pos; p += 2) {
            var lly = staffTop + p * (ls / 2);
            ctx.beginPath();
            ctx.moveTo(noteX - ls * 1.3, lly);
            ctx.lineTo(noteX + ls * 1.3, lly);
            ctx.stroke();
        }
    }
    if (noteInfo.pos <= -2) {
        for (var p2 = -2; p2 >= noteInfo.pos; p2 -= 2) {
            var lly2 = staffTop + p2 * (ls / 2);
            ctx.beginPath();
            ctx.moveTo(noteX - ls * 1.3, lly2);
            ctx.lineTo(noteX + ls * 1.3, lly2);
            ctx.stroke();
        }
    }

    // Note head (filled ellipse, tilted)
    ctx.save();
    ctx.translate(noteX, noteY);
    ctx.rotate(-0.28);
    ctx.fillStyle = noteColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, ls * 0.7, ls * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Stem
    ctx.strokeStyle = noteColor;
    ctx.lineWidth = 2;
    var stemLen = ls * 3;
    ctx.beginPath();
    if (noteInfo.pos <= 4) {
        // stem down, left side
        ctx.moveTo(noteX - ls * 0.6, noteY + ls * 0.1);
        ctx.lineTo(noteX - ls * 0.6, noteY + stemLen);
    } else {
        // stem up, right side
        ctx.moveTo(noteX + ls * 0.6, noteY - ls * 0.1);
        ctx.lineTo(noteX + ls * 0.6, noteY - stemLen);
    }
    ctx.stroke();

    // Note name label
    if (showLabel) {
        var labelX = noteX + ls * 2.5;
        var labelColor = NOTE_COLORS[noteInfo.name] || '#666';
        var radius = ls * 0.85;

        ctx.beginPath();
        ctx.arc(labelX, noteY, radius, 0, Math.PI * 2);
        ctx.fillStyle = labelColor;
        ctx.fill();

        ctx.font = 'bold ' + Math.round(ls * 1.1) + 'px "Grandstander", sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(noteInfo.name, labelX, noteY);
        ctx.textAlign = 'start';
    }
}

   Game Logic
   ============================================ */
function createAnswerButtons() {
    var container = document.getElementById('answerButtons');
    container.innerHTML = '';
    for (var i = 0; i < NOTE_NAMES.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'note-btn';
        btn.setAttribute('data-note', NOTE_NAMES[i]);
        btn.textContent = NOTE_NAMES[i];
        btn.addEventListener('click', (function(name) {
            return function() { handleAnswer(name); };
        })(NOTE_NAMES[i]));
        container.appendChild(btn);
    }

function renderHearts() {
    var container = document.getElementById('hudHearts');
    container.innerHTML = '';
    var level = LEVELS[state.levelIndex];
    for (var i = 0; i < level.lives; i++) {
        var heart = document.createElement('i');
        heart.className = 'fa-solid fa-heart hud-heart';
        heart.id = 'heart-' + i;
        if (i >= state.lives) heart.classList.add('lost');
        container.appendChild(heart);
    }
}

function updateHUD() {
    var level = LEVELS[state.levelIndex];
    document.getElementById('hudLevel').textContent = '第 ' + level.id + ' 關';
    document.getElementById('hudScore').textContent = state.score;
    document.getElementById('progressText').textContent = state.correctInLevel + ' / ' + level.target;
    document.getElementById('progressBar').style.width = (state.correctInLevel / level.target * 100) + '%';

    var streakBadge = document.getElementById('streakBadge');
    var streakCount = document.getElementById('streakCount');
    if (state.streak >= 3) {
        streakBadge.classList.add('visible');
        streakCount.textContent = state.streak;
    } else {
        streakBadge.classList.remove('visible');
    }

    // Timer
    var timerEl = document.getElementById('hudTimer');
    if (level.timeLimit) {
        timerEl.classList.add('visible');
        document.getElementById('timerText').textContent = state.timeLeft;
        if (state.timeLeft <= 10) {
            timerEl.classList.add('urgent');
        } else {
            timerEl.classList.remove('urgent');
        }
    } else {
        timerEl.classList.remove('visible');
    }
}

function pickNextNote() {
    var level = LEVELS[state.levelIndex];
    var available = level.notes.slice();
    // Avoid repeating same note twice
    if (available.length > 1 && state.lastNoteKey) {
        var idx = available.indexOf(state.lastNoteKey);
        if (idx > -1) available.splice(idx, 1);
    }
    var chosen = available[Math.floor(Math.random() * available.length)];
    state.currentNoteKey = chosen;
    state.lastNoteKey = chosen;
    return chosen;
}

function showNextNote() {
    var noteKey = pickNextNote();
    drawStaff(noteKey, null, false);
    state.isAnswering = true;

    // Play note sound
    if (NOTE_FREQ[noteKey]) {
        playTone(NOTE_FREQ[noteKey], 0.5);
    }

    // Enable buttons
    var btns = document.querySelectorAll('.note-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('disabled', 'correct-btn', 'wrong-btn');
    }
}

function showFeedback(correct) {
    var el = document.getElementById('feedbackMsg');
    el.classList.remove('show-correct', 'show-wrong');
    void el.offsetWidth; // reflow
    if (correct) {
        el.textContent = CORRECT_MSGS[Math.floor(Math.random() * CORRECT_MSGS.length)];
        el.classList.add('show-correct');
    } else {
        el.textContent = WRONG_MSGS[Math.floor(Math.random() * WRONG_MSGS.length)];
        el.classList.add('show-wrong');
    }
}

function createParticles(x, y) {
    var colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7'];
    for (var i = 0; i < 12; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', ((Math.random() - 0.5) * 180) + 'px');
        p.style.setProperty('--dy', (-(Math.random() * 120 + 40)) + 'px');
        p.style.width = (5 + Math.random() * 6) + 'px';
        p.style.height = p.style.width;
        document.body.appendChild(p);
        (function(el) {
            el.addEventListener('animationend', function() { el.remove(); });
        })(p);
    }
}

function handleAnswer(noteName) {
    if (!state.isAnswering) return;
    state.isAnswering = false;

    var noteInfo = NOTES_MAP[state.currentNoteKey];
    var correct = noteInfo.name === noteName;
    var container = document.getElementById('staffContainer');

    // Highlight correct/wrong button
    var btns = document.querySelectorAll('.note-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.add('disabled');
        if (btns[i].getAttribute('data-note') === noteName && !correct) {
            btns[i].classList.add('wrong-btn');
        }
        if (btns[i].getAttribute('data-note') === noteInfo.name) {
            btns[i].classList.add('correct-btn');
        }
    }

    if (correct) {
        state.correctInLevel++;
        state.totalCorrect++;
        state.streak++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;

        var points = 10 + Math.max(0, (state.streak - 1)) * 5;
        state.score += points;

        drawStaff(state.currentNoteKey, 'correct', true);
        container.classList.remove('correct-flash');
        void container.offsetWidth;
        container.classList.add('correct-flash');
        showFeedback(true);
        playCorrectSound();

        // Particles on the staff
        var rect = container.getBoundingClientRect();
        createParticles(rect.left + rect.width * 0.55, rect.top + rect.height * 0.4);

        updateHUD();

        var level = LEVELS[state.levelIndex];
        if (state.correctInLevel >= level.target) {
            setTimeout(function() { finishLevel(true); }, 700);
        } else {
            setTimeout(showNextNote, 700);
        }
    } else {
        state.wrongInLevel++;
        state.totalWrong++;
        state.streak = 0;
        state.lives--;

        drawStaff(state.currentNoteKey, 'wrong', true);
        container.classList.remove('shake');
        void container.offsetWidth;
        container.classList.add('shake');
        showFeedback(false);
        playWrongSound();

        // Animate heart loss
        var heartEl = document.getElementById('heart-' + state.lives);
        if (heartEl) {
            heartEl.classList.add('losing');
            setTimeout(function() {
                heartEl.classList.remove('losing');
                heartEl.classList.add('lost');
            }, 400);
        }

        updateHUD();

        if (state.lives <= 0) {
            setTimeout(function() { finishLevel(false); }, 1000);
        } else {
            setTimeout(showNextNote, 1200);
        }
    }
}

function startLevel(levelIdx) {
    state.levelIndex = levelIdx;
    state.currentNoteKey = null;
    state.correctInLevel = 0;
    state.wrongInLevel = 0;
    state.streak = 0;
    state.lastNoteKey = null;

    var level = LEVELS[levelIdx];
    state.lives = level.lives;

    createAnswerButtons();
    renderHearts();
    updateHUD();
    showScreen('screen-game');

    // Timer for level 5
    if (level.timeLimit) {
        state.timeLeft = level.timeLimit;
        updateHUD();
        state.timerInterval = setInterval(function() {
            state.timeLeft--;
            updateHUD();
            if (state.timeLeft <= 0) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
                finishLevel(false);
            }
        }, 1000);
    }

    setTimeout(showNextNote, 400);
}

function finishLevel(passed) {
    if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
    }
    state.isAnswering = false;

    var level = LEVELS[state.levelIndex];
    var stars = 0;
    if (passed) {
        if (state.wrongInLevel === 0) stars = 3;
        else if (state.wrongInLevel === 1) stars = 2;
        else stars = 1;
    }
    state.levelStars[state.levelIndex] = Math.max(state.levelStars[state.levelIndex], stars);

    // Build result screen
    var starsHTML = '';
    for (var s = 0; s < 3; s++) {
        starsHTML += '<i class="fa-solid fa-star' + (s < stars ? '' : ' empty') + '"></i>';
    }
    document.getElementById('resultStars').innerHTML = starsHTML;

    if (passed) {
        document.getElementById('resultTitle').textContent = '過關成功！';
        document.getElementById('resultSubtitle').textContent =
            stars === 3 ? '完美表現！零失誤！' :
            stars === 2 ? '表現優秀！繼續努力！' : '成功過關！下次爭取更多星星！';
    } else {
        document.getElementById('resultTitle').textContent = '挑戰失敗';
        document.getElementById('resultSubtitle').textContent = state.lives <= 0 ? '愛心用完了，再試一次吧！' : '時間到了！再挑戰一次？';
    }

    var statsHTML = '' +
        '<div class="stat-item"><div class="stat-value">' + state.correctInLevel + '</div><div class="stat-label">答對</div></div>' +
        '<div class="stat-item"><div class="stat-value">' + state.wrongInLevel + '</div><div class="stat-label">答錯</div></div>' +
        '<div class="stat-item"><div class="stat-value">' + state.score + '</div><div class="stat-label">總分</div></div>';
    if (level.timeLimit && passed) {
        var timeBonus = state.timeLeft * 2;
        state.score += timeBonus;
        statsHTML += '<div class="stat-item"><div class="stat-value">+' + timeBonus + '</div><div class="stat-label">時間獎勵</div></div>';
    }
    document.getElementById('resultStats').innerHTML = statsHTML;

    var buttonsHTML = '';
    if (passed) {
        if (state.levelIndex < LEVELS.length - 1) {
            buttonsHTML = '<button class="btn-secondary" onclick="retryLevel()"><i class="fa-solid fa-rotate-right"></i> 重玩</button>' +
                          '<button class="btn-primary" onclick="goNextLevel()"><i class="fa-solid fa-arrow-right"></i> 下一關</button>';
        } else {
            buttonsHTML = '<button class="btn-primary" onclick="showVictory()"><i class="fa-solid fa-trophy"></i> 查看成績</button>';
        }
    } else {
        buttonsHTML = '<button class="btn-secondary" onclick="goHome()"><i class="fa-solid fa-house"></i> 返回</button>' +
                      '<button class="btn-primary" onclick="retryLevel()"><i class="fa-solid fa-rotate-right"></i> 再試一次</button>';
    }
    document.getElementById('resultButtons').innerHTML = buttonsHTML;

    showScreen('screen-result');

    // Confetti for passed levels
    if (passed) {
        createConfettiRain();
    }
}

function createConfettiRain() {
    var card = document.getElementById('resultCard');
    var colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899'];
    for (var i = 0; i < 40; i++) {
        (function(idx) {
            setTimeout(function() {
                var c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = (Math.random() * 100) + '%';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                c.style.width = (6 + Math.random() * 8) + 'px';
                c.style.height = (6 + Math.random() * 8) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                card.appendChild(c);
                c.addEventListener('animationend', function() { c.remove(); });
            }, idx * 40);
        })(i);
    }
}

function retryLevel() {
    startLevel(state.levelIndex);
}

function goNextLevel() {
    showLevelIntro(state.levelIndex + 1);
}

function goHome() {
    renderLevelPreview();
    showScreen('screen-start');
}

function showVictory() {
    var totalStars = 0;
    for (var i = 0; i < state.levelStars.length; i++) totalStars += state.levelStars[i];

    document.getElementById('victorySubtitle').textContent =
        totalStars >= 13 ? '近乎完美的演出！你是音樂大師！' :
        totalStars >= 10 ? '很棒的表現！繼續練習更上一層樓！' :
        '恭喜完成所有關卡！多練習可以拿到更多星星！';

    var statsHTML = '' +
        '<div class="victory-stat"><div class="stat-value" style="color:var(--gold)">' + totalStars + '/15</div><div class="stat-label">總星數</div></div>' +
        '<div class="victory-stat"><div class="stat-value">' + state.score + '</div><div class="stat-label">最終分數</div></div>' +
        '<div class="victory-stat"><div class="stat-value">' + state.totalCorrect + '</div><div class="stat-label">答對</div></div>' +
        '<div class="victory-stat"><div class="stat-value">' + state.bestStreak + '</div><div class="stat-label">最高連擊</div></div>';
    document.getElementById('victoryStats').innerHTML = statsHTML;

    showScreen('screen-victory');
    createConfettiRain();
}

function resetGame() {
    state.score = 0;
    state.totalCorrect = 0;
    state.totalWrong = 0;
    state.bestStreak = 0;
    state.levelStars = [0, 0, 0, 0, 0];
    renderLevelPreview();
    showScreen('screen-start');
}

/* ============================================
   Event Listeners
   ============================================ */
document.getElementById('btnStart').addEventListener('click', function() {
    ensureAudio();
    showLevelIntro(0);
});

document.getElementById('btnGo').addEventListener('click', function() {
    startLevel(state.levelIndex > 0 ? state.levelIndex : (LEVELS[document.getElementById('introLevelNum').textContent.match(/\d+/)[0] - 1] ? document.getElementById('introLevelNum').textContent.match(/\d+/)[0] - 1 : 0));
});

document.getElementById('btnRestart').addEventListener('click', resetGame);

/* ============================================
   Fix btnGo to properly track which level intro is showing
   ============================================ */
var pendingLevelIdx = 0;
var origShowLevelIntro = showLevelIntro;
showLevelIntro = function(levelIdx) {
    pendingLevelIdx = levelIdx;
    origShowLevelIntro(levelIdx);
};
document.getElementById('btnGo').removeEventListener('click', function(){});
document.getElementById('btnGo').addEventListener('click', function() {
    startLevel(pendingLevelIdx);
});

/* ============================================
   Init
   ============================================ */
createBgNotes();
renderLevelPreview();
initCanvas();
drawStaff(null, null, false);
